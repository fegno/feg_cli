name: feg_cli
description: A CLI for generate flutter templates
version: 0.0.1-dev.6
repository: https://github.com/fegno/feg_cli
topics: [cli, codegen, test, template, boilerplate]
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  args: ^2.7.0
  cli_completion: ^0.5.0
  mason: ^0.1.0-dev.57
  mason_logger: ^0.3.3
  path: ^1.9.0
  pub_updater: ^0.5.0
  #*Mono repos
  app_name_changer:
    path: packages/app_name_changer
  app_package_name_changer:
    path: packages/app_package_name_changer

dev_dependencies:
  build_runner: ^2.4.4
  build_verify: ^3.1.0
  build_version: ^2.1.1
  very_good_analysis: ^7.0.0

executables:
  feg_cli:
